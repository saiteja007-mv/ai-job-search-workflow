<!-- HTML signature appended to outreach EMAILS sent from the primary alias (lib/outreach-email.mjs). The legacy mailbox sends no signature. -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#1f2937;margin-top:8px;">
  <tr>
    <td style="padding:0 14px 0 0;vertical-align:middle;">
      <img src="https://www.<YOUR_DOMAIN>/assets/images/email-signature-headshot.png" alt="<YOUR_NAME>" width="80" height="80" style="display:block;width:80px;height:80px;border:0;border-radius:40px;" />
    </td>
    <td style="padding:0 0 0 14px;border-left:2px solid #2563eb;vertical-align:middle;">
      <div style="font-size:15px;line-height:20px;font-weight:bold;color:#111827;"><YOUR_NAME></div>
      <div style="font-size:13px;line-height:18px;color:#4b5563;"><TARGET_ROLE> (e.g. AI/ML Engineer)</div>
      <div style="font-size:13px;line-height:18px;padding-top:4px;"><a href="mailto:<YOUR_EMAIL>" style="color:#2563eb;text-decoration:none;"><YOUR_EMAIL></a></div>
      <div style="font-size:13px;line-height:18px;"><a href="https://www.<YOUR_DOMAIN>/" style="color:#2563eb;text-decoration:none;">Portfolio</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="https://www.linkedin.com/in/<PROFILE_SLUG>/" style="color:#2563eb;text-decoration:none;">LinkedIn</a></div>
    </td>
  </tr>
</table>
